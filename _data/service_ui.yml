  who_label: María Salmerón · Traductora-Intérprete Jurada de Francés
  profile_points:
    - Traductora-Intérprete Jurada de francés nombrada por el Ministerio de Asuntos Exteriores, Unión Europea y Cooperación de España.
    - Atención personalizada para conocer el documento, el idioma de destino y los requisitos de presentación.
    - Especialización en traducciones entre francés y español.
    - Servicio a distancia para clientes en España y Francia.
    - Presupuesto personalizado según el documento, su extensión y las necesidades del encargo.
    - Entrega digital o en papel, según las necesidades del cliente y los requisitos del organismo destinatario.
  process_steps:
    - title: Envío del documento
      text: Comparte una copia legible del documento y, si lo sabes, indica el organismo y el trámite para el que lo necesitas.
    - title: Análisis y presupuesto
      text: Revisaré el contenido, la extensión y las particularidades del documento para preparar un presupuesto.
    - title: Confirmación del encargo
      text: Antes de empezar, confirmaremos el alcance del trabajo, el plazo y la modalidad de entrega.
    - title: Realización de la traducción
      text: Una vez confirmado el encargo, realizaré la traducción jurada entre francés y español.
    - title: Entrega al cliente
      text: Recibirás la traducción en formato digital o en papel, según lo acordado y lo que requiera el organismo destinatario.
  related_intro: Consulta otros tipos de traducción jurada o vuelve a la página general de servicios.
