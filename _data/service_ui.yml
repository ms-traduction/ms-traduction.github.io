  who_label: María Salmerón · Traductrice-Interprète Assermentée espagnol-français
  profile_points:
    - Traductrice-Interprète Assermentée de français nommée par le ministère espagnol des Affaires étrangères.
    - Un accompagnement personnalisé selon le document, la langue cible et les exigences de l’organisme destinataire.
    - Une spécialisation dans les traductions entre le français et l’espagnol.
    - Un service à distance pour les clients en Espagne et en France.
    - Un devis personnalisé selon le document, son volume et les besoins de la mission.
    - Une remise numérique ou sur papier, selon vos besoins et les exigences de l’organisme destinataire.
  process_steps:
    - title: Envoi du document
      text: Transmettez une copie lisible du document et, si vous le connaissez, précisez l’organisme et la démarche concernés.
    - title: Analyse et devis
      text: J’examine le contenu, le volume et les particularités du document afin d’établir un devis.
    - title: Confirmation de la commande
      text: Avant de commencer, nous confirmons le périmètre, le délai et le mode de remise.
    - title: Réalisation de la traduction
      text: Une fois la commande confirmée, je réalise la traduction assermentée entre le français et l’espagnol.
    - title: Remise au client
      text: Vous recevez la traduction au format numérique ou sur papier, selon ce qui a été convenu et les exigences de l’organisme destinataire.
  related_intro: Découvrez d’autres traductions assermentées ou consultez la page générale des services.
