civil:
  es:
    keyword: traducción jurada de documentos civiles
    presentation:
      - La traducción jurada de documentos civiles reproduce oficialmente la información de actas y certificados redactados en francés o español. Puede ser necesaria cuando presentas un documento extranjero ante una administración, un registro o una autoridad del otro país.
      - María Salmerón, Traductora-Intérprete Jurada de Francés nombrada por el Ministerio de Asuntos Exteriores, realiza traducciones entre francés y español para trámites personales y familiares. Los requisitos concretos dependen del organismo que recibirá la documentación.
    when_intro: Puede que necesites traducir un documento civil cuando un trámite en España o Francia exige aportar un certificado emitido en el otro idioma.
    situations:
      - Inscripción de un nacimiento, matrimonio o defunción en un registro civil.
      - Preparación de un expediente matrimonial, de nacionalidad o de estado civil.
      - Presentación de certificados de soltería, viudedad o fe de vida ante un organismo.
      - Aportación de un libro de familia u otra documentación familiar a una autoridad.
    faqs:
      - question: ¿Se puede traducir un certificado de nacimiento francés al español?
        answer: Sí. Puedo traducir certificados y actas de nacimiento entre francés y español. Consulta antes con el registro u organismo destinatario si solicita un modelo, una fecha de expedición o documentos adicionales.
      - question: ¿Necesito traducir también el libro de familia?
        answer: Depende del trámite y de la autoridad que revisará el expediente. Pregunta qué páginas o documentos deben presentarse para evitar traducir información que no te hayan solicitado.
      - question: ¿La traducción de un acta de matrimonio sirve para cualquier trámite?
        answer: La traducción jurada acredita su contenido, pero cada organismo establece sus propias condiciones de aceptación y puede pedir requisitos adicionales. Confirma los requisitos con la entidad destinataria.
      - question: ¿Tengo que enviar el certificado original?
        answer: Para solicitar un presupuesto puedes empezar enviando una copia legible. Si el organismo exige el original o una modalidad concreta de entrega, indícalo antes de confirmar el encargo.
    related: [administrative, legal, academic]
  fr:
    keyword: traduction assermentée d’acte de naissance espagnol
    presentation:
      - Une traduction assermentée de documents d’état civil restitue officiellement les informations contenues dans un acte ou un certificat rédigé en espagnol ou en français. Elle peut être demandée pour présenter un document étranger à une administration, un registre ou une autorité de l’autre pays.
      - María Salmerón, Traductrice-Interprète Assermentée de français nommée par le ministère espagnol des Affaires étrangères, traduit vos documents entre l’espagnol et le français pour vos démarches personnelles et familiales. L’organisme destinataire fixe les exigences applicables.
    when_intro: Une traduction peut être nécessaire lorsqu’une démarche en Espagne ou en France exige un document d’état civil rédigé dans l’autre langue.
    situations:
      - Inscription d’une naissance, d’un mariage ou d’un décès auprès d’un registre d’état civil.
      - Constitution d’un dossier de mariage, de nationalité ou de situation familiale.
      - Présentation d’un certificat de célibat, de veuvage ou de vie à une administration.
      - Transmission d’un livret de famille ou de pièces familiales à une autorité.
    faqs:
      - question: Peut-on traduire un acte de naissance espagnol en français ?
        answer: Oui. Je traduis les actes et certificats de naissance de l’espagnol vers le français et du français vers l’espagnol. Vérifiez auprès du destinataire s’il demande un modèle, une date de délivrance ou des pièces complémentaires.
      - question: Faut-il traduire toutes les pages du livret de famille ?
        answer: Cela dépend de la démarche et de l’organisme qui examine le dossier. Demandez quelles pages ou pièces doivent être fournies afin de limiter la traduction aux éléments nécessaires.
      - question: Une traduction assermentée d’acte de mariage est-elle valable pour toutes les démarches ?
        answer: La traduction certifie le contenu traduit, mais chaque organisme fixe ses conditions de réception et peut demander des formalités supplémentaires. Confirmez les exigences auprès du destinataire.
      - question: Dois-je envoyer l’original de mon acte ?
        answer: Une copie lisible suffit pour demander un devis. Si l’organisme exige l’original ou un mode de remise particulier, précisez-le avant de confirmer la commande.

academic:
  es:
    keyword: traducción jurada de títulos universitarios
    presentation:
      - La traducción jurada académica permite presentar títulos, expedientes y certificados emitidos en francés ante instituciones que trabajan en español, o a la inversa. Es útil para que universidades y organismos puedan revisar los estudios y resultados reflejados en la documentación.
      - María Salmerón traduce documentación académica entre francés y español para solicitudes de admisión, reconocimiento de estudios y trámites de homologación. La institución receptora determina qué piezas y formato necesita.
    when_intro: La traducción puede formar parte de un expediente académico cuando la universidad, centro educativo u organismo pide la documentación en su idioma oficial.
    situations:
      - Solicitud de admisión o matrícula en una universidad de España o Francia.
      - Presentación de títulos y notas para una homologación o equivalencia de estudios.
      - Acreditación de formación ante un centro educativo o una entidad pública.
      - Preparación de un expediente que incluye programas, certificados y asignaturas cursadas.
    faqs:
      - question: ¿Qué documentos necesito traducir para homologar un título?
        answer: La lista varía según el título y el procedimiento. Puede incluir el diploma, el expediente académico, las asignaturas o certificados complementarios; confirma la relación exacta con el organismo que tramita tu solicitud.
      - question: ¿Debo traducir las notas además del diploma?
        answer: Si la institución pide el expediente o el certificado de notas, también deberá traducirse. Revisa las instrucciones de admisión u homologación antes de encargar los documentos.
      - question: ¿Se traducen los programas de las asignaturas?
        answer: Sí, puedo traducir programas y otros documentos académicos. Como suelen ser extensos, envíalos junto con los requisitos de la institución para preparar un presupuesto adecuado.
      - question: ¿La traducción jurada garantiza que homologuen mis estudios?
        answer: No. La traducción sirve para presentar la documentación en el idioma requerido, pero la decisión de reconocer u homologar los estudios corresponde a la institución competente.
    related: [administrative, civil, commercial]
  fr:
    keyword: traduction assermentée de diplôme espagnol
    presentation:
      - La traduction assermentée de documents académiques permet de présenter des diplômes, relevés et attestations délivrés en espagnol à un établissement francophone, ou inversement. Les universités et organismes peuvent ainsi examiner les études et résultats mentionnés dans le dossier.
      - María Salmerón traduit vos documents universitaires entre le français et l’espagnol pour les admissions, la reconnaissance d’études et les demandes d’équivalence. L’établissement destinataire précise les pièces et le format à fournir.
    when_intro: Une traduction peut être requise lorsque l’université, l’établissement d’enseignement ou l’administration demande les justificatifs dans sa langue.
    situations:
      - Candidature ou inscription dans une université en Espagne ou en France.
      - Présentation d’un diplôme et de relevés pour une équivalence ou une reconnaissance d’études.
      - Justification d’une formation auprès d’un établissement ou d’un organisme public.
      - Constitution d’un dossier comprenant des programmes et des relevés de matières.
    faqs:
      - question: Quels documents traduire pour faire reconnaître un diplôme espagnol ?
        answer: La liste dépend du diplôme et de la procédure. Elle peut comprendre le diplôme, le relevé de notes ou des attestations complémentaires ; demandez à l’organisme concerné la liste exacte des pièces.
      - question: Faut-il aussi traduire les relevés de notes ?
        answer: Si l’établissement demande le relevé ou le dossier universitaire, ces documents doivent également être traduits. Consultez les consignes d’admission ou de reconnaissance avant de passer commande.
      - question: Pouvez-vous traduire le programme détaillé des cours ?
        answer: Oui, je peux traduire des programmes et d’autres documents d’études. Transmettez-les avec les consignes de l’établissement afin d’obtenir un devis tenant compte de leur volume.
      - question: La traduction assermentée garantit-elle l’équivalence de mon diplôme ?
        answer: Non. Elle permet de présenter les documents dans la langue demandée ; la décision de reconnaissance ou d’équivalence relève de l’établissement ou de l’administration compétente.

legal:
  es:
    keyword: traducción jurada de documentos notariales y jurídicos
    presentation:
      - La traducción jurada notarial y jurídica transmite al francés o al español el contenido de documentos que formalizan actos, contratos o decisiones legales. Está dirigida a particulares, notarías, empresas y profesionales que preparan trámites con documentación en el otro idioma.
      - María Salmerón traduce poderes, escrituras y documentación procesal entre francés y español. Es importante facilitar el contexto y el organismo destinatario para identificar los requisitos de presentación aplicables.
    when_intro: Puede solicitarse una traducción jurada cuando una notaría, un juzgado, una administración o un profesional jurídico necesita consultar un documento redactado en francés o español.
    situations:
      - Firma o presentación de poderes, escrituras y documentos ante una notaría.
      - Aportación de contratos o testamentos a un trámite en el otro país.
      - Presentación de sentencias y resoluciones judiciales en un procedimiento.
      - Gestión de una herencia o sucesión con documentos emitidos en Francia o España.
    faqs:
      - question: ¿Qué documentos notariales se pueden traducir?
        answer: Puedo traducir poderes, escrituras, actas, contratos y testamentos, entre otros. Envía el documento y especifica su uso para que el presupuesto tenga en cuenta su extensión y formato.
      - question: ¿Una traducción jurada sustituye a la apostilla?
        answer: No necesariamente. La traducción y la apostilla son trámites distintos; confirma con la autoridad destinataria si exige apostilla, legalización u otra formalidad además de la traducción.
      - question: ¿Se pueden traducir sentencias y resoluciones judiciales?
        answer: Sí. Para valorar un expediente judicial, conviene incluir todas las páginas, sellos y anexos que la autoridad haya solicitado traducir.
      - question: ¿La notaría o el juzgado aceptará la traducción?
        answer: Los requisitos de presentación dependen de la entidad y del procedimiento. Comprueba con la notaría, el juzgado o el profesional que lleva el asunto qué tipo de traducción y entrega solicita.
    related: [civil, administrative, commercial]
  fr:
    keyword: traduction assermentée de documents notariés espagnols
    presentation:
      - La traduction assermentée de documents notariés et juridiques restitue en français ou en espagnol le contenu d’actes, de contrats ou de décisions de justice. Elle s’adresse aux particuliers, études notariales, entreprises et professionnels qui préparent une démarche avec des pièces dans l’autre langue.
      - María Salmerón traduit procurations, actes notariés et documents de procédure entre le français et l’espagnol. Le contexte et l’organisme destinataire permettent de vérifier les modalités de présentation.
    when_intro: Une traduction assermentée peut être demandée lorsqu’un notaire, un tribunal, une administration ou un professionnel du droit doit examiner une pièce rédigée en espagnol ou en français.
    situations:
      - Signature ou présentation d’une procuration ou d’un acte auprès d’un notaire.
      - Production d’un contrat ou d’un testament dans le cadre d’une démarche à l’étranger.
      - Présentation d’un jugement ou d’une décision de justice dans une procédure.
      - Règlement d’une succession avec des documents établis en Espagne ou en France.
    faqs:
      - question: Quels actes notariés espagnols peuvent être traduits en français ?
        answer: Je peux traduire des procurations, actes, procès-verbaux, contrats et testaments, entre autres. Transmettez le document et précisez son usage pour que le devis tienne compte du volume et de la mise en page.
      - question: La traduction assermentée remplace-t-elle l’apostille ?
        answer: Pas nécessairement. La traduction et l’apostille sont deux formalités distinctes ; vérifiez auprès du destinataire si une apostille, une légalisation ou une autre formalité est également demandée.
      - question: Pouvez-vous traduire un jugement ou une décision de justice ?
        answer: Oui. Pour évaluer un dossier judiciaire, pensez à joindre toutes les pages, les cachets et les annexes que l’autorité demande de traduire.
      - question: Le notaire ou le tribunal acceptera-t-il la traduction ?
        answer: Les exigences varient selon l’organisme et la procédure. Demandez au notaire, au tribunal ou au professionnel chargé du dossier le type de traduction et de remise requis.

medical:
  es:
    keyword: traducción jurada de documentos médicos
    presentation:
      - La traducción jurada médica permite presentar informes y justificantes sanitarios en francés o español ante un centro médico, una aseguradora o una autoridad que los solicite. La precisión de diagnósticos, tratamientos, fechas y datos del paciente resulta esencial para que el documento pueda revisarse.
      - María Salmerón traduce documentación sanitaria entre francés y español para pacientes, profesionales y entidades. El presupuesto se prepara a partir de los documentos y del uso previsto.
    when_intro: Puede ser necesaria al trasladar documentación clínica a otro país o al incorporarla a un expediente que exige traducción jurada.
    situations:
      - Presentación de un historial clínico o informe de alta a un centro médico.
      - Aportación de certificados e informes para una aseguradora o un expediente administrativo.
      - Continuidad de un seguimiento médico con un profesional francófono o hispanohablante.
      - Entrega de resultados de pruebas o informes de especialistas a una entidad destinataria.
    faqs:
      - question: ¿Cómo solicito la traducción jurada de un informe médico?
        answer: Envía una copia legible e indica el idioma de destino y quién recibirá el informe. Para proteger tu privacidad, puedes ocultar datos que no sean necesarios para preparar el presupuesto.
      - question: ¿Se pueden traducir historiales clínicos extensos?
        answer: Sí. El volumen y la legibilidad pueden influir en el presupuesto y el plazo; envía el expediente completo o las partes que te hayan pedido traducir.
      - question: ¿Debo incluir resultados de pruebas y anexos?
        answer: Si el centro o la entidad solicita esos resultados o anexos, inclúyelos. Comprueba qué páginas forman parte de la documentación requerida antes de enviar el encargo.
      - question: ¿La traducción médica se entrega de forma confidencial?
        answer: La documentación sanitaria debe tratarse con especial cuidado. Comparte únicamente la información necesaria para valorar y realizar el encargo, y consulta con el destinatario la modalidad de entrega que acepta.
    related: [administrative, civil, legal]
  fr:
    keyword: traduction assermentée de documents médicaux espagnols
    presentation:
      - Une traduction assermentée médicale permet de présenter des rapports et justificatifs de santé en français ou en espagnol à un établissement médical, un assureur ou une administration qui les demande. La précision des diagnostics, traitements, dates et données du patient est essentielle à la lecture du document.
      - María Salmerón traduit des documents médicaux entre le français et l’espagnol pour les patients, professionnels et organismes. Le devis est établi à partir des pièces à traduire et de leur usage.
    when_intro: Elle peut être utile pour transmettre un dossier médical à l’étranger ou l’ajouter à un dossier qui exige une traduction assermentée.
    situations:
      - Présentation d’un dossier médical ou d’un compte rendu à un établissement de santé.
      - Transmission de certificats à une assurance ou à un dossier administratif.
      - Poursuite d’un suivi médical auprès d’un professionnel francophone ou hispanophone.
      - Remise de résultats d’examens ou de rapports de spécialistes à un organisme.
    faqs:
      - question: Comment demander la traduction assermentée d’un rapport médical ?
        answer: Envoyez une copie lisible en précisant la langue cible et le destinataire du rapport. Pour préserver votre vie privée, vous pouvez masquer les données qui ne sont pas nécessaires à l’établissement du devis.
      - question: Peut-on traduire un dossier médical volumineux ?
        answer: Oui. Le volume et la lisibilité peuvent influer sur le devis et le délai ; transmettez le dossier complet ou les parties demandées par l’organisme.
      - question: Dois-je joindre les résultats d’examens et les annexes ?
        answer: Joignez-les si l’établissement ou l’organisme les a demandés. Vérifiez quelles pages font partie du dossier à fournir avant d’envoyer la commande.
      - question: Comment sont traités les documents médicaux confidentiels ?
        answer: Les documents de santé demandent une attention particulière. Ne transmettez que les informations nécessaires à l’évaluation et à la réalisation de la mission, et vérifiez le mode de remise accepté par le destinataire.
    related: [administrative, civil, legal]

commercial:
  es:
    keyword: traducción jurada de documentos comerciales
    presentation:
      - La traducción jurada de documentos comerciales y financieros facilita la presentación de información societaria, contractual o bancaria ante entidades que trabajan en francés o español. Es una opción para empresas, profesionales y particulares que preparan operaciones entre España y Francia.
      - María Salmerón traduce esta documentación entre francés y español. Para valorar términos, tablas, anexos y extensión, es útil indicar la entidad destinataria y el objetivo del documento.
    when_intro: Una entidad puede pedir la traducción jurada de documentos empresariales o financieros cuando se utilizan para una operación o trámite en el otro país.
    situations:
      - Constitución, modificación o acreditación de una sociedad ante una entidad extranjera.
      - Presentación de cuentas anuales o balances a una administración o entidad financiera.
      - Negociación o formalización de contratos mercantiles entre empresas.
      - Aportación de documentación bancaria a un expediente de negocio o inversión.
    faqs:
      - question: ¿Qué documentos de una sociedad se suelen traducir?
        answer: Puedo traducir estatutos, escrituras, cuentas, contratos y certificados societarios. La documentación requerida depende del trámite y de la entidad que la solicita.
      - question: ¿Se conservan las tablas y cifras del documento financiero?
        answer: La traducción mantiene el contenido y la estructura necesaria para identificar la información. Envía una copia completa para que pueda revisar tablas, notas y anexos al preparar el presupuesto.
      - question: ¿Cómo se calcula el presupuesto de un contrato o balance extenso?
        answer: El presupuesto tiene en cuenta la extensión y las particularidades del documento. Puedes utilizar la estimación online y solicitar después una confirmación personalizada enviando la documentación.
      - question: ¿La traducción jurada sirve para abrir una cuenta o registrar una empresa?
        answer: Puede formar parte de la documentación que solicita una entidad, pero cada banco, registro o administración establece sus propios requisitos. Confirma con el destinatario qué documentos y formalidades necesita.
    related: [legal, administrative, academic]
  fr:
    keyword: traduction assermentée de documents commerciaux espagnols
    presentation:
      - La traduction assermentée de documents commerciaux et financiers facilite la présentation de pièces sociétaires, contractuelles ou bancaires auprès d’organismes francophones ou hispanophones. Elle concerne les entreprises, professionnels et particuliers préparant une opération entre l’Espagne et la France.
      - María Salmerón traduit ces documents entre le français et l’espagnol. Pour évaluer la terminologie, les tableaux, les annexes et le volume, précisez l’organisme destinataire et l’usage du document.
    when_intro: Un organisme peut demander une traduction assermentée de documents d’entreprise ou financiers lorsqu’ils sont utilisés dans une démarche ou une opération à l’étranger.
    situations:
      - Création ou modification d’une société auprès d’un organisme étranger.
      - Présentation de comptes annuels ou de bilans à une administration ou à une banque.
      - Négociation ou signature de contrats commerciaux entre entreprises.
      - Transmission de pièces bancaires pour un dossier professionnel ou d’investissement.
    faqs:
      - question: Quels documents d’entreprise peut-on faire traduire ?
        answer: Je peux traduire des statuts, actes constitutifs, comptes, contrats et attestations de société. Les pièces requises dépendent de la démarche et de l’organisme qui les demande.
      - question: Les tableaux et chiffres sont-ils repris dans la traduction ?
        answer: La traduction restitue le contenu et la structure nécessaires à la compréhension du document. Transmettez une copie complète afin que les tableaux, notes et annexes puissent être pris en compte dans le devis.
      - question: Comment établir un devis pour un contrat ou un bilan volumineux ?
        answer: Le devis tient compte du volume et des particularités du document. Vous pouvez d’abord consulter l’estimation en ligne, puis demander une confirmation personnalisée en transmettant les pièces.
      - question: Une traduction assermentée suffit-elle pour immatriculer une société ?
        answer: Elle peut faire partie des pièces demandées, mais chaque banque, registre ou administration définit ses propres exigences. Vérifiez les documents et formalités nécessaires auprès du destinataire.
    related: [legal, administrative, academic]

administrative:
  es:
    keyword: traducción jurada para trámites administrativos
    presentation:
      - La traducción jurada para trámites administrativos permite presentar certificados y documentos extranjeros ante organismos públicos en España o Francia. Está destinada a personas que realizan gestiones de residencia, nacionalidad, visado, conducción u otros procedimientos oficiales.
      - María Salmerón traduce documentación entre francés y español y puede orientarte sobre el presupuesto a partir de los documentos que te han solicitado. La administración destinataria determina la vigencia y las formalidades aplicables.
    when_intro: "Revisa las instrucciones del trámite: si la administración recibe documentos en otro idioma, puede pedir una traducción jurada junto con el documento original."
    situations:
      - Solicitud o renovación de residencia, nacionalidad o visado.
      - Presentación de un certificado de antecedentes penales.
      - Canje o reconocimiento de un permiso de conducir.
      - Aportación de certificados extranjeros a un expediente administrativo.
    faqs:
      - question: ¿Se necesita traducción jurada de antecedentes penales franceses?
        answer: Puede solicitarse cuando se presenta el certificado ante una autoridad española, pero la exigencia depende del procedimiento y del organismo. Comprueba también la fecha de expedición y la vigencia que admite.
      - question: ¿Qué documentos se traducen para solicitar la nacionalidad?
        answer: Cada expediente tiene requisitos propios. Actas civiles, certificados y otros documentos pueden formar parte de la solicitud; utiliza la lista oficial del organismo para identificar cuáles deben traducirse.
      - question: ¿Puedo presentar una traducción jurada para el canje del permiso de conducir?
        answer: Si la autoridad solicita la traducción de documentos del permiso, puedo traducirlos entre francés y español. Confirma con el organismo qué piezas y formato requiere.
      - question: ¿La administración me pedirá una traducción en papel?
        answer: Depende de la sede y del trámite. Antes de encargarla, consulta si acepta una copia digital o exige una traducción en papel y qué formalidades deben acompañarla.
    related: [civil, legal, academic]
  fr:
    keyword: traduction assermentée de documents administratifs espagnols
    presentation:
      - La traduction assermentée pour les démarches administratives permet de présenter des certificats et documents étrangers auprès d’organismes publics en Espagne ou en France. Elle concerne notamment les demandes de résidence, de nationalité, de visa, de permis de conduire et d’autres procédures officielles.
      - María Salmerón traduit vos documents entre le français et l’espagnol et peut établir un devis à partir des pièces demandées. L’administration destinataire précise leur durée de validité et les formalités applicables.
    when_intro: "Consultez les consignes de la démarche : si l’administration reçoit une pièce dans une autre langue, elle peut demander une traduction assermentée avec le document source."
    situations:
      - Demande ou renouvellement d’un titre de séjour, de nationalité ou de visa.
      - Présentation d’un extrait de casier judiciaire.
      - Échange ou reconnaissance d’un permis de conduire.
      - Ajout de certificats étrangers à un dossier administratif.
    faqs:
      - question: Faut-il traduire un extrait de casier judiciaire espagnol ?
        answer: Une traduction peut être demandée lorsqu’il est présenté à une autorité francophone, mais les exigences dépendent de la procédure et de l’organisme. Vérifiez également la date de délivrance et la durée de validité acceptée.
      - question: Quels documents traduire pour une demande de nationalité ?
        answer: Chaque dossier a ses propres exigences. Des actes d’état civil, certificats ou autres pièces peuvent être demandés ; référez-vous à la liste officielle de l’administration pour savoir lesquels faire traduire.
      - question: Puis-je faire traduire des documents pour échanger mon permis de conduire ?
        answer: Si l’autorité demande la traduction de documents liés au permis, je peux les traduire entre le français et l’espagnol. Vérifiez les pièces et le format requis auprès de l’organisme.
      - question: L’administration acceptera-t-elle une traduction numérique ?
        answer: Cela dépend du service et de la démarche. Avant de commander, demandez si une copie numérique suffit ou si une remise sur papier et des formalités complémentaires sont nécessaires.
