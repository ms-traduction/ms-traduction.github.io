interpreting_support:
  es:
    slug: acompanamiento-linguistico
    card_title: Acompañamiento lingüístico
    title: Acompañamiento lingüístico e interpretación
    meta_title: Acompañamiento lingüístico e interpretación | María Salmerón
    meta_description: Interpretación español-francés para ayuntamientos, notarías, hospitales, registros civiles y gestiones oficiales, presencial o por videoconferencia.
    intro: Te acompaño en español y francés en gestiones importantes para que puedas comunicarte con claridad, comprender cada paso y sentirte respaldado durante todo el proceso.
    photo_label: Espacio para fotografía de acompañamiento
    section_label: A tu lado
    section_title: Apoyo lingüístico en momentos importantes
    section_intro: Una comunicación clara y fiel ayuda a que cada persona participe con confianza en sus gestiones.
    services:
      - title: Ayuntamientos y actos oficiales
        text: Acompañamiento en ceremonias, bodas civiles, actos oficiales y encuentros con representantes municipales.
      - title: Notarías y gestiones oficiales
        text: Interpretación en notarías y otras situaciones oficiales que requieren una comunicación precisa entre español y francés.
      - title: Hospitales y centros sanitarios
        text: Asistencia lingüística para facilitar el intercambio de información entre pacientes, familiares y profesionales sanitarios.
      - title: Registros civiles y trámites administrativos
        text: Acompañamiento en registros civiles y gestiones administrativas para comprender y transmitir correctamente cada información.
      - title: Comunicación entre francófonos e hispanohablantes
        text: Apoyo personalizado en gestiones y conversaciones en las que las diferencias lingüísticas pueden dificultar el entendimiento.
    modality_label: A tu medida
    modality_title: Presencial o por videoconferencia
    modality_intro: La modalidad se adapta al tipo de gestión, a las personas participantes y a las condiciones del servicio.
    in_person_title: Acompañamiento presencial
    in_person_text: Para citas, ceremonias y gestiones en las que la presencia de la intérprete facilita la comunicación directa.
    remote_title: Videoconferencia
    remote_text: Una alternativa práctica cuando el contexto permite interpretar a distancia y las personas disponen de una conexión adecuada.
    cta_title: ¿Necesitas acompañamiento lingüístico?
    cta_email_subject: Solicitud de acompañamiento lingüístico
  fr:
    slug: accompagnement-linguistique
    card_title: Accompagnement linguistique
    title: Accompagnement linguistique et interprétation
    meta_title: Accompagnement linguistique et interprétation | María Salmerón
    meta_description: Interprétation français-espagnol en mairie, chez le notaire, à l’hôpital, à l’état civil et lors de démarches officielles, en présentiel ou en visioconférence.
    intro: Je vous accompagne en français et en espagnol lors de démarches importantes, afin que vous puissiez communiquer clairement, comprendre chaque étape et vous sentir soutenu tout au long du parcours.
    photo_label: Espace photo pour l’accompagnement linguistique
    section_label: À vos côtés
    section_title: Un soutien linguistique dans les moments importants
    section_intro: Une communication claire et fidèle permet à chacun de participer en confiance à ses démarches.
    services:
      - title: Mairies et actes officiels
        text: Accompagnement lors de cérémonies, mariages civils, actes officiels et échanges avec les représentants municipaux.
      - title: Études notariales et démarches officielles
        text: Interprétation chez le notaire et dans les situations officielles qui exigent une communication précise entre le français et l’espagnol.
      - title: Hôpitaux et centres de santé
        text: Assistance linguistique pour faciliter les échanges entre les patients, leurs proches et les professionnels de santé.
      - title: État civil et démarches administratives
        text: Accompagnement auprès des services d’état civil et lors de démarches administratives pour comprendre et transmettre chaque information correctement.
      - title: Échanges entre francophones et hispanophones
        text: Un soutien adapté lorsque les différences linguistiques peuvent compliquer les démarches et la compréhension mutuelle.
    modality_label: Selon vos besoins
    modality_title: En présentiel ou en visioconférence
    modality_intro: La modalité dépend du type de démarche, des personnes présentes et des conditions de la prestation.
    in_person_title: Accompagnement en présentiel
    in_person_text: Pour les rendez-vous, cérémonies et démarches où la présence de l’interprète facilite les échanges directs.
    remote_title: Visioconférence
    remote_text: Une solution pratique lorsque le contexte se prête à l’interprétation à distance et que chacun dispose d’une connexion adaptée.
    cta_title: Vous avez besoin d’un accompagnement linguistique ?
    cta_email_subject: Demande d’accompagnement linguistique

