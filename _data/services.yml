civil:
  es:
    slug: documentos-civiles
    card_title: Documentos civiles
    title: Traducción jurada de documentos civiles
    meta_title: Traducción jurada de documentos civiles | María Salmerón
    meta_description: Traduce actas de nacimiento, matrimonio y otros documentos civiles del francés al español o viceversa. Solicita presupuesto a María Salmerón.
    intro: Traduzco documentos del registro civil entre francés y español para presentarlos ante organismos y autoridades en España o Francia.
    list_title: Documentos civiles que puedo traducir
    documents:
      - Certificados y actas de nacimiento
      - Certificados y actas de matrimonio
      - Certificados y actas de defunción
      - Certificados de soltería, viudedad y fe de vida
      - Libros de familia y otros documentos del registro civil
    details_title: Traducciones para tus trámites civiles
    details:
      - La traducción jurada incorpora la certificación, firma y sello de una traductora nombrada por el Ministerio de Asuntos Exteriores, Unión Europea y Cooperación de España.
      - Antes de solicitarla, confirma con el organismo destinatario qué documentos y formato requiere. Puedes enviarme una copia para recibir un presupuesto sin compromiso.
    cta_title: ¿Necesitas traducir un documento civil?
    cta_text: Cuéntame qué documento necesitas y para qué trámite; te indicaré cómo solicitar tu presupuesto.
    cta_label: Solicitar presupuesto
  fr:
    slug: documents-etat-civil
    card_title: Documents d’état civil
    title: Traduction assermentée de documents d’état civil
    meta_title: Traduction d’acte de naissance espagnol | María Salmerón
    meta_description: Traduction assermentée d’actes de naissance, mariage et autres documents d’état civil entre l’espagnol et le français. Demandez votre devis.
    intro: Je traduis vos documents d’état civil entre le français et l’espagnol pour vos démarches auprès des organismes et autorités en Espagne ou en France.
    list_title: Documents d’état civil que je traduis
    documents:
      - Actes et certificats de naissance
      - Actes et certificats de mariage
      - Actes et certificats de décès
      - Certificats de célibat, de veuvage et de vie
      - Livrets de famille et autres documents d’état civil
    details_title: Des traductions pour vos démarches d’état civil
    details:
      - La traduction assermentée comporte la certification, la signature et le cachet d’une traductrice nommée par le ministère espagnol des Affaires étrangères.
      - Avant de commander, vérifiez les documents et le format demandés par l’organisme destinataire. Vous pouvez m’envoyer une copie pour recevoir un devis sans engagement.
    cta_title: Besoin de traduire un document d’état civil ?
    cta_text: Indiquez-moi le document à traduire et votre démarche ; je vous expliquerai comment obtenir un devis.
    cta_label: Demander un devis

