      - title: Réunions d’entreprise
        text: Un appui lors des réunions de travail pour faciliter la participation des équipes francophones et hispanophones.
      - title: Négociations commerciales
        text: Interprétation précise des propositions, accords et nuances au fil des échanges commerciaux.
      - title: Relations entre entreprises françaises et espagnoles
        text: Accompagnement lors de rencontres entre clients, fournisseurs et entreprises des deux pays.
