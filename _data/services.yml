    details:
      - Cada documento jurídico requiere especial atención a su terminología, estructura y datos identificativos. La traducción jurada incluye la certificación, firma y sello correspondientes.
      - Los requisitos de presentación pueden variar según la notaría, el juzgado o la autoridad destinataria. Confirma qué documentación debes aportar antes de solicitar la traducción.
