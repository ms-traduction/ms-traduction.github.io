      - Documents relatifs aux successions et héritages
      - Documents pour les procédures judiciaires
    details_title: Traductions pour vos démarches juridiques et notariales
    details:
      - Les documents juridiques demandent une attention particulière à la terminologie, à la structure et aux éléments d’identification. La traduction assermentée comporte la certification, la signature et le cachet requis.
      - Les modalités de présentation varient selon l’étude notariale, le tribunal ou l’autorité destinataire. Vérifiez les documents demandés avant de commander la traduction.
    cta_title: Vous avez des documents notariés ou juridiques ?
    cta_text: Précisez les documents à traduire et l’organisme destinataire pour recevoir un devis.
    cta_label: Demander un devis

medical:
  es:
    slug: documentos-medicos-sanitarios
    card_title: Documentos médicos y sanitarios
    title: Traducción jurada de documentos médicos y sanitarios
    meta_title: Traducción jurada de documentos médicos | María Salmerón
    meta_description: Traducción jurada francés-español de informes médicos, historiales clínicos y certificados sanitarios. Atención a distancia y presupuesto personalizado.
    intro: Traduzco documentos médicos y sanitarios entre francés y español para trámites asistenciales, administrativos y profesionales.
    list_title: Documentación médica y sanitaria
    documents:
      - Informes médicos y certificados médicos
      - Historiales clínicos y documentación hospitalaria
      - Informes de alta y resultados de pruebas
      - Informes de especialistas y tratamientos
      - Otra documentación sanitaria
    details_title: Traducciones precisas de documentación sanitaria
    details:
      - La traducción de informes y expedientes médicos requiere precisión en la terminología clínica, los tratamientos y los datos del paciente. La documentación se trata de forma confidencial.
      - Confirma con el centro médico o el organismo destinatario qué documentos y formato necesita. Para solicitar presupuesto, puedes compartir una copia y ocultar los datos que no sean necesarios.
    cta_title: ¿Necesitas traducir un informe médico?
    cta_text: Cuéntame qué documentación sanitaria necesitas traducir y para qué trámite.
    cta_label: Solicitar presupuesto
  fr:
    slug: documents-medicaux-sanitaires
    card_title: Documents médicaux et sanitaires
    title: Traduction assermentée de documents médicaux et sanitaires
    meta_title: Traduction de documents médicaux espagnols | María Salmerón
    meta_description: Traduction assermentée de rapports médicaux et dossiers de santé espagnols vers le français, avec devis adapté à vos documents.
    intro: Je traduis vos documents médicaux et sanitaires entre le français et l’espagnol pour vos démarches médicales, administratives et professionnelles.
    list_title: Documents médicaux et sanitaires
    documents:
      - Rapports et certificats médicaux
      - Dossiers médicaux et documents hospitaliers
      - Comptes rendus d’hospitalisation et résultats d’examens
      - Rapports de spécialistes et documents de traitement
      - Autres documents de santé
    details_title: Des traductions précises de documents de santé
    details:
      - La traduction de rapports et dossiers médicaux exige une terminologie précise pour les diagnostics, traitements et données du patient. Vos documents sont traités de manière confidentielle.
      - Vérifiez auprès du centre médical ou de l’organisme destinataire les documents et le format demandés. Pour un devis, vous pouvez transmettre une copie en masquant les données non nécessaires.
    cta_title: Vous devez faire traduire un rapport médical ?
    cta_text: Indiquez-moi les documents de santé à traduire et la démarche concernée.
    cta_label: Demander un devis

